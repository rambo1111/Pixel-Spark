<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Spark ✨ AI Image Generator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <a href="#" aria-label="Homepage" class="logo-link">
            <div class="logo-container">
                <img src="assets/logo.png" alt="Pixel Spark Logo" class="logo">
                <span class="logo-text">Pixel Spark</span>
            </div>
        </a>
        <a href="https://github.com/rambo1111/Pixel-Spark" target="_blank" rel="noopener noreferrer" class="github-btn" aria-label="GitHub Repository">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        </a>
    </header>

    <div id="loader-overlay" class="loader-overlay hidden">
        <div class="loader-dots">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <p>Generating an image for: <b id="random-word-display"></b> ⏳</p>
    </div>

    <main class="container">
        <div class="card">
            <div class="card-content">
                <h1>AI Image Generator 🤖</h1>
                <p class="description">
                    Witness random creation! 🎲 This tool uses the <strong>FLUX.1-schnell</strong> AI model to generate a unique 8-bit style image from a randomly fetched word. Adjust the settings below and see what you create! 🖼️
                </p>

                <div class="controls">
                    <div class="slider-group">
                        <label for="width">Width ↔️: <span id="width-value">512</span>px</label>
                        <input type="range" id="width" min="256" max="2048" value="512" step="64">
                    </div>
                    <div class="slider-group">
                        <label for="height">Height ↕️: <span id="height-value">512</span>px</label>
                        <input type="range" id="height" min="256" max="2048" value="512" step="64">
                    </div>
                    <div class="slider-group">
                        <label for="steps">Inference Steps ⚙️: <span id="steps-value">4</span></label>
                        <input type="range" id="steps" min="1" max="50" value="4" step="1">
                    </div>
                </div>

                <button id="generate-btn" class="btn-primary">Generate 🚀</button>
            </div>

            <div id="result-container" class="result-container">
                <div class="image-wrapper">
                    <img id="generated-image" src="" alt="Generated AI image">
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js" type="module"></script>
</body>
</html>
